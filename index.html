<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 동네 숨은 맛집</title>
<style>
  :root {
    --accent: #f97316;
    --accent-strong: #c2410c;
    --accent-deep: #9a3412;
    --accent-soft: #fff1e6;
    --bg: #fffaf5;
    --card: #ffffff;
    --text: #2b2118;
    --muted: #7a6a5c;
    --line: #f0e3d6;
    --danger: #b42318;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 28px 16px 56px; }

  header h1 { margin: 0; font-size: 1.7rem; letter-spacing: -0.02em; }
  header h1 span { color: var(--accent-strong); }
  header p { margin: 6px 0 0; color: var(--muted); }

  .panel {
    margin-top: 20px;
    padding: 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-top: 4px solid var(--accent);
    border-radius: 14px;
    box-shadow: 0 2px 10px rgba(194, 65, 12, 0.06);
  }
  .row { display: grid; gap: 12px; margin-bottom: 12px; }
  .row.two { grid-template-columns: 1fr 1fr; }
  label { display: block; font-size: 0.9rem; font-weight: 600; }
  .req { color: var(--accent-strong); }
  input, select {
    display: block;
    width: 100%;
    min-height: 44px;
    margin-top: 6px;
    padding: 10px 12px;
    font: inherit;
    font-size: 16px; /* 16px 미만이면 iOS가 입력 시 화면을 확대한다 */
    font-weight: 400;
    color: var(--text);
    background: #fff;
    border: 1px solid #e3d3c3;
    border-radius: 10px;
  }
  input:focus, select:focus, button:focus-visible {
    outline: 3px solid rgba(249, 115, 22, 0.35);
    outline-offset: 1px;
    border-color: var(--accent);
  }
  .msg { min-height: 1.4em; margin: 4px 0 8px; color: var(--danger); font-size: 0.9rem; }
  button { font: inherit; cursor: pointer; }
  .primary {
    width: 100%;
    min-height: 48px;
    color: #fff;
    font-weight: 700;
    background: var(--accent-strong);
    border: 0;
    border-radius: 10px;
  }
  .primary:hover { background: var(--accent-deep); }

  .inline { display: flex; gap: 8px; }
  .inline input { flex: 1; min-width: 0; }
  .ai {
    flex: none;
    min-height: 44px;
    margin-top: 6px;
    padding: 0 14px;
    color: var(--accent-strong);
    font-weight: 700;
    white-space: nowrap;
    background: var(--accent-soft);
    border: 1px solid var(--accent);
    border-radius: 10px;
  }
  .ai:hover:not(:disabled) { background: #ffe3cc; }
  .ai:disabled { opacity: 0.6; cursor: wait; }

  .list-head { display: flex; align-items: baseline; gap: 8px; margin: 32px 0 12px; }
  .list-head h2 { margin: 0; font-size: 1.15rem; }
  .list-head span { color: var(--muted); font-size: 0.9rem; }
  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .card {
    padding: 16px;
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 4px solid var(--accent);
    border-radius: 14px;
    box-shadow: 0 2px 10px rgba(194, 65, 12, 0.05);
  }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .card-name { margin: 0; font-size: 1.1rem; word-break: break-word; }
  .stars { display: block; margin-top: 2px; color: var(--accent); letter-spacing: 2px; }
  .menu {
    display: inline-block;
    margin-top: 8px;
    padding: 2px 10px;
    color: var(--accent-deep);
    font-size: 0.85rem;
    background: var(--accent-soft);
    border-radius: 999px;
    word-break: break-word;
  }
  .review { margin: 8px 0 0; word-break: break-word; }
  .del {
    flex: none;
    min-height: 36px;
    padding: 0 12px;
    color: var(--muted);
    font-size: 0.85rem;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .del:hover { color: var(--danger); border-color: var(--danger); }
  .cm-toggle {
    margin-top: 12px;
    padding: 6px 0;
    color: var(--accent-strong);
    font-size: 0.9rem;
    font-weight: 600;
    background: none;
    border: 0;
  }
  .cm-box { margin-top: 8px; padding-top: 12px; border-top: 1px dashed var(--line); }
  .cm-list { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 6px; }
  .cm-item { margin: 0; padding: 8px 12px; font-size: 0.92rem; background: var(--bg); border-radius: 10px; word-break: break-word; }
  .cm-none { margin: 0 0 10px; color: var(--muted); font-size: 0.9rem; }
  .cm-form { display: flex; gap: 8px; }
  .cm-form input { flex: 1; min-width: 0; margin-top: 0; }
  .cm-form button {
    flex: none;
    min-height: 44px;
    padding: 0 14px;
    color: #fff;
    font-weight: 700;
    background: var(--accent-strong);
    border: 0;
    border-radius: 10px;
  }
  .cm-form button:hover { background: var(--accent-deep); }
  .cm-msg { min-height: 1.2em; margin: 6px 0 0; color: var(--danger); font-size: 0.85rem; }
  .empty {
    margin: 0;
    padding: 28px 16px;
    color: var(--muted);
    text-align: center;
    background: var(--card);
    border: 1px dashed #e3d3c3;
    border-radius: 14px;
  }

  @media (max-width: 480px) {
    .wrap { padding-top: 20px; }
    .row.two { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>우리 동네 <span>숨은 맛집</span></h1>
    <p>가본 맛집을 기록하고 동네 사람들과 함께 봐요.</p>
  </header>

  <form id="form" class="panel" novalidate>
    <div class="row two">
      <label>식당 이름 <span class="req">*</span>
        <input id="name" maxlength="30" autocomplete="off" placeholder="예) 골목 칼국수">
      </label>
      <label>메뉴
        <input id="menu" maxlength="30" autocomplete="off" placeholder="예) 바지락 칼국수">
      </label>
    </div>
    <div class="row">
      <label>별점 <span class="req">*</span>
        <select id="rating">
          <option value="">별점 선택</option>
          <option value="5">★★★★★ (5점)</option>
          <option value="4">★★★★☆ (4점)</option>
          <option value="3">★★★☆☆ (3점)</option>
          <option value="2">★★☆☆☆ (2점)</option>
          <option value="1">★☆☆☆☆ (1점)</option>
        </select>
      </label>
    </div>
    <div class="row">
      <div>
        <label for="review">한줄평</label>
        <div class="inline">
          <input id="review" maxlength="100" autocomplete="off" placeholder="예) 국물이 시원하고 면이 쫄깃해요">
          <button type="button" id="ai" class="ai">AI 추천</button>
        </div>
      </div>
    </div>
    <p id="msg" class="msg" role="alert"></p>
    <button type="submit" class="primary">추가</button>
  </form>

  <div class="list-head">
    <h2>등록된 맛집</h2>
    <span id="count"></span>
  </div>
  <ul id="list" class="list"></ul>
  <p id="empty" class="empty" hidden>아직 등록된 맛집이 없어요. 첫 맛집을 추가해 보세요!</p>
</div>

<script>
// 공개용(publishable) 키라 화면에 둬도 된다. 서비스 롤 키는 절대 넣지 않는다.
const SUPABASE_URL = 'https://lbaskywunnnvxjhmiuzf.supabase.co';
const SUPABASE_KEY = 'sb_publishable_cvmU1m4Kov_9sHCHc3yNCQ_4-tAHNCC';
const LIMIT = { name: 30, menu: 30, review: 100, comment: 100 };
const len = (s) => Array.from(s).length; // DB의 char_length와 같은 기준(글자 수)

// 저장소: Supabase(PostgREST). id와 created_at은 DB가 만든다.
async function api(table, path, options = {}) {
  let res;
  try {
    res = await fetch(`${SUPABASE_URL}/rest/v1/${table}${path}`, {
      ...options,
      headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json', ...options.headers },
    });
  } catch {
    throw new Error('서버에 연결할 수 없어요. 인터넷 연결을 확인해 주세요.');
  }
  if (!res.ok) throw new Error('요청을 처리하지 못했어요. 잠시 뒤 다시 시도해 주세요.');
  return res;
}

const store = {
  async list() {
    const res = await api('restaurants', '?select=*&order=created_at.desc');
    return res.json();
  },
  async add(item) {
    await api('restaurants', '', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify(item) });
  },
  async remove(id) {
    await api('restaurants', `?id=eq.${encodeURIComponent(id)}`, { method: 'DELETE' }); // 댓글은 DB에서 함께 지워진다
  },
};

const commentStore = {
  async list() {
    const res = await api('comments', '?select=*&order=created_at.asc');
    return res.json();
  },
  async add(restaurantId, body) {
    await api('comments', '', {
      method: 'POST',
      headers: { Prefer: 'return=minimal' },
      body: JSON.stringify({ restaurant_id: restaurantId, body }),
    });
  },
};

const openComments = new Set(); // 펼쳐 둔 카드 id. 목록을 다시 그려도 유지한다.

const $ = (id) => document.getElementById(id);
const form = $('form');
const nameEl = $('name');
const menuEl = $('menu');
const ratingEl = $('rating');
const reviewEl = $('review');
const msgEl = $('msg');
const listEl = $('list');
const emptyEl = $('empty');
const countEl = $('count');

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function renderComments(r, comments) {
  const wrap = el('div');

  const toggle = el('button', 'cm-toggle', `댓글 ${comments.length}개`);
  toggle.type = 'button';
  const box = el('div', 'cm-box');
  const open = openComments.has(r.id);
  box.hidden = !open;
  toggle.setAttribute('aria-expanded', String(open));
  toggle.addEventListener('click', () => {
    box.hidden = !box.hidden;
    toggle.setAttribute('aria-expanded', String(!box.hidden));
    if (box.hidden) openComments.delete(r.id);
    else openComments.add(r.id);
  });

  if (comments.length) {
    const ul = el('ul', 'cm-list');
    ul.append(...comments.map((c) => el('li', 'cm-item', c.body)));
    box.append(ul);
  } else {
    box.append(el('p', 'cm-none', '아직 댓글이 없어요.'));
  }

  const form = el('form', 'cm-form');
  const input = el('input');
  input.maxLength = LIMIT.comment;
  input.placeholder = '댓글을 남겨 보세요';
  input.autocomplete = 'off';
  input.setAttribute('aria-label', `${r.name} 댓글`);
  const send = el('button', undefined, '등록');
  send.type = 'submit';
  form.append(input, send);
  const msg = el('p', 'cm-msg');
  msg.setAttribute('role', 'alert');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = input.value.trim();
    if (!body) return void (msg.textContent = '댓글을 입력해 주세요.');
    if (len(body) > LIMIT.comment) return void (msg.textContent = `댓글은 ${LIMIT.comment}자 이하로 써 주세요.`);
    send.disabled = true;
    try {
      await commentStore.add(r.id, body);
      openComments.add(r.id);
      await refresh();
    } catch (err) {
      msg.textContent = err.message;
      send.disabled = false;
    }
  });

  box.append(form, msg);
  wrap.append(toggle, box);
  return wrap;
}

function renderCard(r, comments = []) {
  const rating = Math.min(5, Math.max(1, r.rating));
  const li = el('li', 'card');

  const top = el('div', 'card-top');
  const info = el('div');
  info.append(el('h3', 'card-name', r.name));
  const stars = el('span', 'stars', '★'.repeat(rating) + '☆'.repeat(5 - rating));
  stars.setAttribute('role', 'img');
  stars.setAttribute('aria-label', `별점 ${rating}점`);
  info.append(stars);

  const del = el('button', 'del', '삭제');
  del.type = 'button';
  del.setAttribute('aria-label', `${r.name} 삭제`);
  del.addEventListener('click', async () => {
    try {
      await store.remove(r.id);
      await refresh();
    } catch (err) {
      msgEl.textContent = err.message;
    }
  });

  top.append(info, del);
  li.append(top);
  if (r.menu) li.append(el('span', 'menu', r.menu));
  if (r.review) li.append(el('p', 'review', r.review));
  li.append(renderComments(r, comments));
  return li;
}

async function refresh() {
  // 댓글을 못 불러와도 맛집 목록은 보여 준다.
  const [items, comments] = await Promise.all([store.list(), commentStore.list().catch(() => [])]);
  const byRestaurant = new Map();
  for (const c of comments) byRestaurant.set(c.restaurant_id, [...(byRestaurant.get(c.restaurant_id) || []), c]);
  listEl.replaceChildren(...items.map((r) => renderCard(r, byRestaurant.get(r.id) || [])));
  emptyEl.hidden = items.length > 0;
  countEl.textContent = items.length ? `${items.length}곳` : '';
}

function fail(message, field) {
  msgEl.textContent = message;
  field.focus();
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = nameEl.value.trim();
  const menu = menuEl.value.trim();
  const review = reviewEl.value.trim();
  const rating = Number(ratingEl.value);

  if (!name) return fail('식당 이름을 입력해 주세요.', nameEl);
  if (len(name) > LIMIT.name) return fail(`식당 이름은 ${LIMIT.name}자 이하로 써 주세요.`, nameEl);
  if (len(menu) > LIMIT.menu) return fail(`메뉴는 ${LIMIT.menu}자 이하로 써 주세요.`, menuEl);
  if (!Number.isInteger(rating) || rating < 1 || rating > 5) return fail('별점을 선택해 주세요.', ratingEl);
  if (len(review) > LIMIT.review) return fail(`한줄평은 ${LIMIT.review}자 이하로 써 주세요.`, reviewEl);

  try {
    await store.add({ name, menu: menu || null, rating, review: review || null });
    form.reset();
    msgEl.textContent = '';
    nameEl.focus();
    await refresh();
  } catch (err) {
    msgEl.textContent = err.message;
  }
});

// AI 한줄평 추천: Edge Function만 호출한다(OpenRouter 키는 서버 Secrets에만 있다).
const aiBtn = $('ai');
aiBtn.addEventListener('click', async () => {
  const name = nameEl.value.trim();
  const menu = menuEl.value.trim();
  if (!name) return fail('AI 추천을 받으려면 식당 이름을 먼저 입력해 주세요.', nameEl);
  if (len(name) > LIMIT.name) return fail(`식당 이름은 ${LIMIT.name}자 이하로 써 주세요.`, nameEl);
  if (len(menu) > LIMIT.menu) return fail(`메뉴는 ${LIMIT.menu}자 이하로 써 주세요.`, menuEl);

  msgEl.textContent = '';
  aiBtn.disabled = true;
  aiBtn.textContent = '생각 중…';
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/suggest-review`, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, menu, rating: ratingEl.value ? Number(ratingEl.value) : null }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.review) throw new Error(data.error || 'AI 추천을 받지 못했어요. 잠시 뒤 다시 시도해 주세요.');
    reviewEl.value = data.review;
    reviewEl.focus();
  } catch (err) {
    msgEl.textContent = err instanceof TypeError ? '서버에 연결할 수 없어요. 인터넷 연결을 확인해 주세요.' : err.message;
  } finally {
    aiBtn.disabled = false;
    aiBtn.textContent = 'AI 추천';
  }
});

refresh().catch((err) => {
  msgEl.textContent = err.message;
});
</script>
</body>
</html>
