<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 동네 숨은 맛집</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* NOL 디자인(DESIGN.md) 기준: Pretendard, 서비스 파란색 #4154FF, 1px 테두리와 옅은 면으로 층을 나누고 그림자는 쓰지 않는다. */
  :root {
    --primary: #4154FF;
    --primary-pressed: #2432AD;
    --primary-tint: #F5F6FF;
    --primary-tint-strong: #DFE2FF;
    --text: #1B1C1F;
    --text-2: #6E6F73;
    --text-3: #8B8D92;
    --disabled: #B6B7BB;
    --border: #DADBDF;
    --border-soft: #E9EAEF;
    --divider: #F2F3F7;
    --surface: #F7F8FB;
    --surface-soft: #FAFBFD;
    --danger: #E5000F;
    --danger-pressed: #9C000A;
    --warn: #CC4100;
    --ok: #008161;
    --star: #FDBA39;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: #fff;
    color: var(--text);
    font-family: "Pretendard Variable", "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    letter-spacing: 0;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }

  header h1 { margin: 0; font-size: 24px; line-height: 1.25; font-weight: 700; }
  header h1 span { color: var(--primary); }
  header h1[role="button"] { cursor: pointer; width: fit-content; }
  header h1[role="button"]:focus-visible { outline: 2px solid var(--primary); outline-offset: 4px; border-radius: 6px; }
  header p { margin: 6px 0 0; color: var(--text-2); font-size: 14px; }
  @media (hover: hover) and (pointer: fine) {
    header h1[role="button"]:hover { opacity: 0.75; }
  }

  .panel {
    margin-top: 20px;
    padding: 16px;
    background: var(--surface-soft);
    border: 1px solid var(--border-soft);
    border-radius: 16px;
  }
  .panel h2 { margin: 0 0 4px; font-size: 16px; font-weight: 700; }
  .row { display: grid; gap: 12px; margin-bottom: 12px; }
  .row.two { grid-template-columns: 1fr 1fr; }
  label { display: block; font-size: 13px; font-weight: 600; }
  .req { color: var(--primary); }
  input, select {
    display: block;
    width: 100%;
    min-height: 44px;
    margin-top: 6px;
    padding: 10px 14px;
    font: inherit;
    font-size: 16px; /* 16px 미만이면 iOS가 입력 시 화면을 확대한다 */
    font-weight: 400;
    color: var(--text);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  input::placeholder { color: var(--disabled); }
  input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
  button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .field + .field { margin-top: 12px; }
  .msg { min-height: 1.4em; margin: 4px 0 8px; color: var(--warn); font-size: 13px; }
  .msg.ok { color: var(--ok); }
  button { font: inherit; cursor: pointer; }
  button:disabled { cursor: default; }
  .primary {
    width: 100%;
    min-height: 52px;
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    background: var(--primary);
    border: 0;
    border-radius: 16px;
  }
  .primary:active:not(:disabled) { background: var(--primary-pressed); }
  .primary:disabled { background: var(--disabled); }
  @media (hover: hover) and (pointer: fine) {
    .primary:hover:not(:disabled) { background: var(--primary-pressed); }
  }

  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab {
    flex: 1;
    min-height: 44px;
    color: var(--text-2);
    font-weight: 600;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  .tab.on { color: #fff; background: var(--text); border-color: var(--text); } /* 선택은 파랑이 아니라 어두운 알약 */
  .hint { margin: 12px 0 0; color: var(--text-2); font-size: 12px; }

  .userbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 16px; }
  .userbar .who { flex: 1; min-width: 0; font-weight: 600; word-break: break-all; }
  .badge {
    display: inline-block;
    margin-left: 6px;
    padding: 1px 8px;
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    vertical-align: 1px;
    background: var(--primary);
    border-radius: 999px;
  }
  .small {
    min-height: 36px;
    padding: 0 14px;
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  @media (hover: hover) and (pointer: fine) {
    .small:hover { border-color: var(--primary); color: var(--primary); }
  }

  .inline { display: flex; gap: 8px; }
  .inline input { flex: 1; min-width: 0; }
  .ai {
    flex: none;
    min-height: 44px;
    margin-top: 6px;
    padding: 0 16px;
    color: var(--primary);
    font-weight: 700;
    white-space: nowrap;
    background: var(--primary-tint);
    border: 1px solid var(--primary-tint-strong);
    border-radius: 12px;
  }
  .ai:disabled { opacity: 0.6; cursor: wait; }
  @media (hover: hover) and (pointer: fine) {
    .ai:hover:not(:disabled) { background: var(--primary-tint-strong); }
  }

  .list-head { display: flex; align-items: baseline; gap: 8px; margin: 40px 0 16px; }
  .list-head h2 { margin: 0; font-size: 20px; font-weight: 700; }
  .list-head span { color: var(--text-2); font-size: 14px; }
  /* 후기 카드: 정사각형 타일을 여백 없이(1px 선만) 붙여 놓는다. 자세한 내용은 눌러서 연다. */
  .list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1px;
    background: var(--border-soft);
    border: 1px solid var(--border-soft);
    border-radius: 16px;
    overflow: hidden;
  }
  @media (min-width: 601px) {
    .list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  .card {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
    aspect-ratio: 1 / 1;
    padding: 10px;
    overflow: hidden;
    background: #fff;
    cursor: pointer;
  }
  .card:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
  @media (hover: hover) and (pointer: fine) {
    .card:hover { background: var(--surface-soft); }
  }
  .sq-name {
    margin: 0;
    font-size: 15px;
    line-height: 1.3;
    font-weight: 700;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }
  .sq-stars { color: var(--star); font-size: 12px; line-height: 1; letter-spacing: 1px; }
  .sq-menu {
    align-self: flex-start;
    max-width: 100%;
    padding: 1px 6px;
    color: var(--primary-pressed);
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    background: var(--primary-tint);
    border-radius: 6px;
  }
  .sq-loc { color: var(--text-2); font-size: 11px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .loc { margin: 8px 0 0; color: var(--text-2); font-size: 13px; word-break: break-word; }
  .sq-review {
    flex: 1 1 0;
    min-height: 0;
    margin: 0;
    color: var(--text-2);
    font-size: 11px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }
  @media (min-width: 601px) {
    .sq-review { font-size: 12px; -webkit-line-clamp: 3; }
  }
  .sq-foot { margin-top: auto; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .sq-meta { color: var(--text-3); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sq-counts { display: flex; gap: 8px; color: var(--text-2); font-size: 12px; }

  .pager { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 16px; }
  .pager button {
    min-width: 36px;
    min-height: 36px;
    padding: 0 10px;
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  .pager button.on { color: #fff; background: var(--text); border-color: var(--text); } /* 선택은 어두운 알약 */
  .pager button:disabled:not(.on) { color: var(--disabled); }
  .pager .gap { align-self: center; color: var(--text-3); }
  @media (hover: hover) and (pointer: fine) {
    .pager button:hover:not(:disabled):not(.on) { border-color: var(--primary); color: var(--primary); }
  }

  .detail-dialog { width: min(520px, calc(100vw - 24px)); max-height: calc(100vh - 48px); overflow: auto; }
  .dlg-bar { display: flex; justify-content: flex-end; margin: -4px 0 8px; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .card-name { margin: 0; font-size: 18px; line-height: 1.3; font-weight: 700; word-break: break-word; }
  .stars { display: block; margin-top: 4px; color: var(--star); letter-spacing: 2px; }
  .by { display: block; margin-top: 4px; color: var(--text-2); font-size: 12px; font-weight: 600; word-break: break-all; }
  .when { display: block; margin-top: 2px; color: var(--text-3); font-size: 12px; }
  .menu {
    display: inline-block;
    margin-top: 12px;
    padding: 2px 8px;
    color: var(--primary-pressed);
    font-size: 12px;
    font-weight: 600;
    background: var(--primary-tint);
    border-radius: 6px;
    word-break: break-word;
  }
  .review { margin: 8px 0 0; font-size: 14px; word-break: break-word; }
  .del {
    flex: none;
    min-height: 36px;
    padding: 0 14px;
    color: var(--text-2);
    font-size: 13px;
    font-weight: 600;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  @media (hover: hover) and (pointer: fine) {
    .del:hover { color: var(--danger); border-color: var(--danger); }
  }

  .react { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--divider); }
  .react button {
    min-height: 36px;
    padding: 0 14px;
    color: var(--text);
    font-size: 13px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  .react button:disabled { color: var(--text-2); }
  .react button.mine { color: var(--primary-pressed); font-weight: 700; background: var(--primary-tint); border-color: var(--primary); }
  @media (hover: hover) and (pointer: fine) {
    .react button:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-tint); }
  }

  .cm-toggle {
    margin-top: 8px;
    padding: 8px 0;
    color: var(--primary);
    font-size: 13px;
    font-weight: 700;
    background: none;
    border: 0;
  }
  .cm-box { margin-top: 4px; padding-top: 12px; border-top: 1px solid var(--divider); }
  .cm-list { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 8px; }
  .cm-item { margin: 0; padding: 10px 14px; font-size: 13px; background: var(--surface); border-radius: 12px; word-break: break-word; }
  .cm-none { margin: 0 0 12px; color: var(--text-2); font-size: 13px; }
  .cm-form { display: flex; gap: 8px; }
  .cm-form input { flex: 1; min-width: 0; margin-top: 0; }
  .cm-form button {
    flex: none;
    min-height: 44px;
    padding: 0 16px;
    color: #fff;
    font-weight: 700;
    background: var(--primary);
    border: 0;
    border-radius: 12px;
  }
  .cm-form button:active:not(:disabled) { background: var(--primary-pressed); }
  .cm-form button:disabled { background: var(--disabled); }
  @media (hover: hover) and (pointer: fine) {
    .cm-form button:hover:not(:disabled) { background: var(--primary-pressed); }
  }
  .cm-msg { min-height: 1.2em; margin: 6px 0 0; color: var(--warn); font-size: 12px; }

  .member { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .member .meta { color: var(--text-3); font-size: 12px; }

  .dialog {
    width: min(360px, calc(100vw - 32px));
    padding: 20px;
    color: var(--text);
    background: #fff;
    border: 1px solid var(--border-soft);
    border-radius: 20px;
  }
  .dialog::backdrop { background: rgba(0, 0, 0, 0.5); }
  .dialog h3 { margin: 0 0 6px; font-size: 18px; font-weight: 700; }
  .dialog p.desc, .panel p.desc { margin: 0 0 12px; color: var(--text-2); font-size: 13px; word-break: break-word; }
  .dlg-actions { display: flex; gap: 8px; }
  .dlg-actions button { min-height: 48px; flex: 1; border-radius: 16px; font-weight: 700; }
  .dlg-actions .ghost { color: var(--text); background: #fff; border: 1px solid var(--border); }
  .dlg-actions .primary { width: auto; min-height: 48px; font-size: 14px; }

  .empty {
    margin: 0;
    padding: 32px 16px;
    color: var(--text-2);
    text-align: center;
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 16px;
  }

  @media (min-width: 801px) {
    .wrap { padding: 40px 40px 80px; }
    header h1 { font-size: 32px; }
    header p { font-size: 16px; }
    body { font-size: 14px; }
    input, select { font-size: 14px; }
    .list-head { margin-top: 48px; }
  }
  @media (max-width: 480px) {
    .row.two { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="banner">우리 동네 <span>숨은 맛집</span></h1>
    <p>가본 맛집을 기록하고 동네 사람들과 함께 봐요.</p>
  </header>

  <!-- 로그인 / 회원가입 -->
  <section id="authView" hidden>
    <div class="panel">
      <div class="tabs">
        <button type="button" id="tabLogin" class="tab on">로그인</button>
        <button type="button" id="tabSignup" class="tab">회원가입</button>
      </div>
      <form id="authForm" novalidate>
        <div class="field">
          <label for="authId">아이디</label>
          <input id="authId" maxlength="20" autocomplete="username" autocapitalize="off" placeholder="3~20자 (한글·영문·숫자·_)">
        </div>
        <div class="field">
          <label for="authPw">비밀번호</label>
          <input id="authPw" type="password" maxlength="50" autocomplete="current-password" placeholder="4자 이상">
        </div>
        <div class="field" id="confirmRow" hidden>
          <label for="authPw2">비밀번호 확인</label>
          <input id="authPw2" type="password" maxlength="50" autocomplete="new-password" placeholder="비밀번호를 한 번 더">
        </div>
        <p id="authMsg" class="msg" role="alert"></p>
        <button type="submit" id="authBtn" class="primary">로그인</button>
      </form>
      <p class="hint">회원만 맛집을 보고 쓸 수 있어요. 처음이라면 회원가입을 눌러 주세요.</p>
    </div>
  </section>

  <!-- 로그인한 뒤의 화면 -->
  <section id="appView" hidden>
    <div class="userbar">
      <span class="who" id="who"></span>
      <button type="button" id="membersBtn" class="small" hidden>회원 목록</button>
      <button type="button" id="logoutBtn" class="small">로그아웃</button>
    </div>

    <section id="adminPanel" class="panel" hidden>
      <h2>회원 목록 (관리자)</h2>
      <p class="desc">비밀번호는 암호화되어 있어 아무도 볼 수 없어요. 비밀번호를 잊은 회원은 새 비밀번호로 바꿔 줄 수 있어요.</p>
      <ul id="memberList" class="cm-list"></ul>
      <p id="adminMsg" class="msg" role="alert"></p>
    </section>

    <form id="form" class="panel" novalidate>
      <div class="row two">
        <label>식당 이름 <span class="req">*</span>
          <input id="name" maxlength="30" autocomplete="off" placeholder="예) 골목 칼국수">
        </label>
        <label>메뉴
          <input id="menu" maxlength="30" autocomplete="off" placeholder="예) 바지락 칼국수">
        </label>
      </div>
      <div class="row">
        <label>위치
          <input id="location" maxlength="50" autocomplete="off" placeholder="예) 서울 마포구 합정동">
        </label>
      </div>
      <div class="row">
        <label>별점 <span class="req">*</span>
          <select id="rating">
            <option value="">별점 선택</option>
            <option value="5">★★★★★ (5점)</option>
            <option value="4">★★★★☆ (4점)</option>
            <option value="3">★★★☆☆ (3점)</option>
            <option value="2">★★☆☆☆ (2점)</option>
            <option value="1">★☆☆☆☆ (1점)</option>
          </select>
        </label>
      </div>
      <div class="row">
        <div>
          <label for="review">한줄평</label>
          <div class="inline">
            <input id="review" maxlength="100" autocomplete="off" placeholder="예) 국물이 시원하고 면이 쫄깃해요">
            <button type="button" id="ai" class="ai">AI 추천 리뷰</button>
          </div>
        </div>
      </div>
      <p id="msg" class="msg" role="alert"></p>
      <button type="submit" class="primary">추가</button>
    </form>

    <div class="list-head">
      <h2>등록된 맛집</h2>
      <span id="count"></span>
    </div>
    <ul id="list" class="list"></ul>
    <nav id="pager" class="pager" aria-label="페이지 이동" hidden></nav>
    <p id="empty" class="empty" hidden>아직 등록된 맛집이 없어요. 첫 맛집을 추가해 보세요!</p>
  </section>
</div>

<dialog id="detailDialog" class="dialog detail-dialog" aria-label="후기 자세히 보기">
  <div class="dlg-bar"><button type="button" id="detailClose" class="small">닫기</button></div>
  <div id="detailBody"></div>
</dialog>

<dialog id="resetDialog" class="dialog" aria-labelledby="resetTitle">
  <form id="resetForm" novalidate>
    <h3 id="resetTitle">비밀번호 재설정</h3>
    <p id="resetDesc" class="desc"></p>
    <label for="resetPw">새 비밀번호</label>
    <input id="resetPw" maxlength="50" autocomplete="off" placeholder="4자 이상">
    <p id="resetMsg" class="msg" role="alert"></p>
    <div class="dlg-actions">
      <button type="button" id="resetCancel" class="ghost">취소</button>
      <button type="submit" id="resetOk" class="primary">바꾸기</button>
    </div>
  </form>
</dialog>

<script>
// 모든 요청은 로그인이 필요한 Edge Function(api) 하나로 간다. DB 키는 화면에 없다.
const API_URL = 'https://lbaskywunnnvxjhmiuzf.supabase.co/functions/v1/api';
const TOKEN_KEY = 'session';
const LIMIT = { name: 30, menu: 30, location: 50, review: 100, comment: 100 };
const len = (s) => Array.from(s).length; // DB의 char_length와 같은 기준(글자 수)

const $ = (id) => document.getElementById(id);
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

// ---------- 세션 ----------
let token = '';
try {
  token = localStorage.getItem(TOKEN_KEY) || '';
} catch {
  /* 저장이 막힌 브라우저에서는 새로고침하면 다시 로그인해야 한다 */
}
let me = null; // { username, is_admin }
let state = { restaurants: [], comments: [], counts: [], myVotes: {} };
const openComments = new Set(); // 펼쳐 둔 카드 id. 목록을 다시 그려도 유지한다.

function saveToken(value) {
  token = value;
  try {
    if (value) localStorage.setItem(TOKEN_KEY, value);
    else localStorage.removeItem(TOKEN_KEY);
  } catch {
    /* 무시 */
  }
}

async function call(action, payload = {}) {
  let res;
  try {
    res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action, token, ...payload }),
    });
  } catch {
    throw new Error('서버에 연결할 수 없어요. 인터넷 연결을 확인해 주세요.');
  }
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && token && action !== 'login' && action !== 'signup') {
    endSession('로그인 시간이 지났어요. 다시 로그인해 주세요.');
    throw new Error(data.error || '다시 로그인해 주세요.');
  }
  if (!res.ok) throw new Error(data.error || '요청을 처리하지 못했어요. 잠시 뒤 다시 시도해 주세요.');
  return data;
}

// ---------- 화면 전환 ----------
const authView = $('authView');
const appView = $('appView');
const authMsg = $('authMsg');

// 관리자 모드에서는 제목을 누르면 처음 화면(로그인)으로 돌아간다. 로그아웃과 같다.
const banner = $('banner');
function setBannerLink(on) {
  if (on) {
    banner.setAttribute('role', 'button');
    banner.tabIndex = 0;
    banner.title = '처음 화면(로그인)으로 돌아가기';
  } else {
    banner.removeAttribute('role');
    banner.removeAttribute('tabindex');
    banner.removeAttribute('title');
  }
}

function showAuth(message = '') {
  setBannerLink(false);
  appView.hidden = true;
  authView.hidden = false;
  authMsg.textContent = message;
  $('authPw').value = '';
  $('authPw2').value = '';
}

function showApp() {
  authView.hidden = true;
  appView.hidden = false;
  const who = $('who');
  who.textContent = `${me.username} 님`;
  if (me.is_admin) who.append(el('span', 'badge', '관리자'));
  $('membersBtn').hidden = !me.is_admin;
  $('adminPanel').hidden = true;
  setBannerLink(me.is_admin);
}

function endSession(message) {
  saveToken('');
  me = null;
  state = { restaurants: [], comments: [], counts: [], myVotes: {} };
  openComments.clear();
  detailDialog.close();
  showAuth(message);
}

// ---------- 로그인 / 회원가입 ----------
let mode = 'login';
function setMode(next) {
  mode = next;
  $('tabLogin').classList.toggle('on', next === 'login');
  $('tabSignup').classList.toggle('on', next === 'signup');
  $('confirmRow').hidden = next !== 'signup';
  $('authBtn').textContent = next === 'signup' ? '회원가입' : '로그인';
  $('authPw').autocomplete = next === 'signup' ? 'new-password' : 'current-password';
  authMsg.textContent = '';
}
$('tabLogin').addEventListener('click', () => setMode('login'));
$('tabSignup').addEventListener('click', () => setMode('signup'));

$('authForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = $('authId').value.trim();
  const password = $('authPw').value;
  if (!username) return void (authMsg.textContent = '아이디를 입력해 주세요.');
  if (!password) return void (authMsg.textContent = '비밀번호를 입력해 주세요.');
  if (mode === 'signup') {
    if (len(password) < 4) return void (authMsg.textContent = '비밀번호는 4자 이상으로 입력해 주세요.');
    if (password !== $('authPw2').value) return void (authMsg.textContent = '비밀번호가 서로 달라요. 다시 확인해 주세요.');
  }

  const btn = $('authBtn');
  btn.disabled = true;
  try {
    const res = await call(mode, { username, password });
    saveToken(res.token);
    me = { username: res.username, is_admin: res.is_admin };
    $('authId').value = '';
    $('authPw').value = '';
    $('authPw2').value = '';
    authMsg.textContent = '';
    showApp();
    await refresh();
  } catch (err) {
    authMsg.textContent = err.message;
  } finally {
    btn.disabled = false;
  }
});

function logout() {
  call('logout').catch(() => {});
  endSession('');
  setMode('login');
}
$('logoutBtn').addEventListener('click', logout);
banner.addEventListener('click', () => {
  if (me && me.is_admin) logout();
});
banner.addEventListener('keydown', (e) => {
  if ((e.key === 'Enter' || e.key === ' ') && me && me.is_admin) {
    e.preventDefault();
    logout();
  }
});

// ---------- 맛집 목록 ----------
const listEl = $('list');
const emptyEl = $('empty');
const countEl = $('count');
const msgEl = $('msg');

// 등록한 날짜와 시간을 이 브라우저의 시간대로 보여 준다. 예) 2026. 10. 16. 오후 3:07
function formatWhen(iso) {
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '';
  return d.toLocaleString('ko-KR', { year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

function renderReactions(r, count) {
  const mine = state.myVotes[r.id];
  const box = el('div', 'react');
  const msg = el('span', 'cm-msg');
  msg.setAttribute('role', 'alert');

  const make = (kind, label, n) => {
    const b = el('button', kind === mine ? 'mine' : '', `${label} ${n}`);
    b.type = 'button';
    b.setAttribute('aria-label', `${r.name} ${kind === 'like' ? '좋아요' : '싫어요'} ${n}`);
    b.disabled = Boolean(mine);
    b.addEventListener('click', async () => {
      box.querySelectorAll('button').forEach((x) => (x.disabled = true));
      try {
        await call('react', { restaurant_id: r.id, kind });
        await refresh();
      } catch (err) {
        msg.textContent = err.message;
        await refresh().catch(() => {});
      }
    });
    return b;
  };

  box.append(make('like', '👍 좋아요', count.likes), make('dislike', '👎 싫어요', count.dislikes), msg);
  return box;
}

function renderComments(r, comments) {
  const wrap = el('div');

  const toggle = el('button', 'cm-toggle', `댓글 ${comments.length}개`);
  toggle.type = 'button';
  const box = el('div', 'cm-box');
  const open = openComments.has(r.id);
  box.hidden = !open;
  toggle.setAttribute('aria-expanded', String(open));
  toggle.addEventListener('click', () => {
    box.hidden = !box.hidden;
    toggle.setAttribute('aria-expanded', String(!box.hidden));
    if (box.hidden) openComments.delete(r.id);
    else openComments.add(r.id);
  });

  if (comments.length) {
    const ul = el('ul', 'cm-list');
    ul.append(...comments.map((c) => el('li', 'cm-item', c.body)));
    box.append(ul);
  } else {
    box.append(el('p', 'cm-none', '아직 댓글이 없어요.'));
  }

  const form = el('form', 'cm-form');
  const input = el('input');
  input.maxLength = LIMIT.comment;
  input.placeholder = '댓글을 남겨 보세요';
  input.autocomplete = 'off';
  input.setAttribute('aria-label', `${r.name} 댓글`);
  const send = el('button', undefined, '등록');
  send.type = 'submit';
  form.append(input, send);
  const msg = el('p', 'cm-msg');
  msg.setAttribute('role', 'alert');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const body = input.value.trim();
    if (!body) return void (msg.textContent = '댓글을 입력해 주세요.');
    if (len(body) > LIMIT.comment) return void (msg.textContent = `댓글은 ${LIMIT.comment}자 이하로 써 주세요.`);
    send.disabled = true;
    try {
      await call('add_comment', { restaurant_id: r.id, body });
      openComments.add(r.id);
      await refresh();
    } catch (err) {
      msg.textContent = err.message;
      send.disabled = false;
    }
  });

  box.append(form, msg);
  wrap.append(toggle, box);
  return wrap;
}

// 자세히 보기(창 안): 전체 한줄평, 좋아요·싫어요, 댓글, (관리자) 삭제
function renderDetail(r, comments, count) {
  const rating = Math.min(5, Math.max(1, r.rating));
  openComments.add(r.id); // 자세히 보기에서는 댓글을 처음부터 펼쳐 둔다
  const li = el('div', 'detail');

  const top = el('div', 'card-top');
  const info = el('div');
  info.append(el('h3', 'card-name', r.name));
  const stars = el('span', 'stars', '★'.repeat(rating) + '☆'.repeat(5 - rating));
  stars.setAttribute('role', 'img');
  stars.setAttribute('aria-label', `별점 ${rating}점`);
  info.append(stars);
  if (r.author) info.append(el('span', 'by', `작성자 ${r.author}`));
  const when = formatWhen(r.created_at);
  if (when) {
    const t = el('time', 'when', when);
    t.dateTime = r.created_at;
    info.append(t);
  }
  top.append(info);

  // 삭제는 관리자만 할 수 있다(서버도 다시 확인한다).
  if (me.is_admin) {
    const del = el('button', 'del', '삭제');
    del.type = 'button';
    del.setAttribute('aria-label', `${r.name} 삭제`);
    del.addEventListener('click', async () => {
      if (!confirm(`"${r.name}" 카드를 삭제할까요?\n댓글과 좋아요도 함께 지워져요.`)) return;
      try {
        await call('delete_restaurant', { id: r.id });
        detailDialog.close();
        await refresh();
      } catch (err) {
        msgEl.textContent = err.message;
      }
    });
    top.append(del);
  }

  li.append(top);
  if (r.menu) li.append(el('span', 'menu', r.menu));
  if (r.location) li.append(el('p', 'loc', `📍 ${r.location}`));
  if (r.review) li.append(el('p', 'review', r.review));
  li.append(renderReactions(r, count), renderComments(r, comments));
  return li;
}

// 목록의 정사각형 타일: 이름, 별점, 메뉴, 한줄평 일부, 작성자·날짜, 반응 수만 보여 준다.
function renderTile(r, comments, count) {
  const rating = Math.min(5, Math.max(1, r.rating));
  const li = el('li', 'card');
  li.tabIndex = 0;
  li.setAttribute('role', 'button');
  li.setAttribute('aria-label', `${r.name} 자세히 보기`);
  li.append(el('h3', 'sq-name', r.name));
  const stars = el('span', 'sq-stars', '★'.repeat(rating) + '☆'.repeat(5 - rating));
  stars.setAttribute('role', 'img');
  stars.setAttribute('aria-label', `별점 ${rating}점`);
  li.append(stars);
  if (r.menu) li.append(el('span', 'sq-menu', r.menu));
  if (r.location) li.append(el('span', 'sq-loc', `📍 ${r.location}`));
  li.append(el('p', 'sq-review', r.review || ''));

  const foot = el('div', 'sq-foot');
  const d = new Date(r.created_at);
  const day = Number.isNaN(d.getTime()) ? '' : d.toLocaleDateString('ko-KR', { month: 'numeric', day: 'numeric' });
  foot.append(el('span', 'sq-meta', [r.author, day].filter(Boolean).join(' · ')));
  foot.append(el('span', 'sq-counts', `👍 ${count.likes}  👎 ${count.dislikes}  💬 ${comments.length}`));
  li.append(foot);

  li.addEventListener('click', () => showDetail(r.id));
  li.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      showDetail(r.id);
    }
  });
  return li;
}

const detailDialog = $('detailDialog');
let detailId = null;
let view = { commentsBy: new Map(), countBy: new Map() };

function fillDetail() {
  const r = state.restaurants.find((x) => x.id === detailId);
  if (!r) return detailDialog.close(); // 그 사이 지워진 카드
  $('detailBody').replaceChildren(renderDetail(r, view.commentsBy.get(r.id) || [], view.countBy.get(r.id) || { likes: 0, dislikes: 0 }));
}

function showDetail(id) {
  detailId = id;
  fillDetail();
  if (!detailDialog.open) detailDialog.showModal();
}

$('detailClose').addEventListener('click', () => detailDialog.close());
detailDialog.addEventListener('click', (e) => {
  if (e.target === detailDialog) detailDialog.close(); // 바깥(어두운 곳)을 누르면 닫힌다
});
detailDialog.addEventListener('close', () => {
  detailId = null;
});

// 한 페이지에 6개씩(휴대폰 2열 × 3줄, 넓은 화면 3열 × 2줄). 새로 올리면 1페이지로 돌아간다.
const PAGE_SIZE = 6;
let page = 1;
const pagerEl = $('pager');

function renderList() {
  const totalPages = Math.max(1, Math.ceil(state.restaurants.length / PAGE_SIZE));
  page = Math.min(Math.max(1, page), totalPages); // 마지막 카드를 지워 페이지가 줄어든 경우
  const slice = state.restaurants.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);
  listEl.replaceChildren(
    ...slice.map((r) => renderTile(r, view.commentsBy.get(r.id) || [], view.countBy.get(r.id) || { likes: 0, dislikes: 0 })),
  );
  renderPager(totalPages);
}

function goPage(p) {
  page = p;
  renderList();
  document.querySelector('.list-head').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderPager(totalPages) {
  pagerEl.hidden = totalPages <= 1;
  if (totalPages <= 1) return;
  const button = (label, target, aria, { on = false, disabled = false } = {}) => {
    const b = el('button', on ? 'on' : '', label);
    b.type = 'button';
    b.disabled = disabled;
    b.setAttribute('aria-label', aria);
    if (on) b.setAttribute('aria-current', 'page');
    b.addEventListener('click', () => goPage(target));
    return b;
  };
  // 처음·끝·지금 페이지 앞뒤만 보여 주고 나머지는 …로 줄인다.
  const shown = [...new Set([1, totalPages, page - 1, page, page + 1])].filter((p) => p >= 1 && p <= totalPages).sort((a, b) => a - b);
  const items = [button('‹', page - 1, '이전 페이지', { disabled: page === 1 })];
  shown.forEach((p, i) => {
    const prev = shown[i - 1];
    if (i > 0 && p - prev === 2) items.push(button(String(prev + 1), prev + 1, `${prev + 1}페이지`)); // 한 페이지만 건너뛰면 …보다 번호를 보여 준다
    else if (i > 0 && p - prev > 2) items.push(el('span', 'gap', '…'));
    items.push(button(String(p), p, `${p}페이지`, { on: p === page, disabled: p === page }));
  });
  items.push(button('›', page + 1, '다음 페이지', { disabled: page === totalPages }));
  pagerEl.replaceChildren(...items);
}

async function refresh() {
  state = await call('list');
  const commentsBy = new Map();
  for (const c of state.comments) commentsBy.set(c.restaurant_id, [...(commentsBy.get(c.restaurant_id) || []), c]);
  const countBy = new Map(state.counts.map((c) => [c.restaurant_id, { likes: Number(c.likes), dislikes: Number(c.dislikes) }]));
  view = { commentsBy, countBy };
  renderList();
  if (detailDialog.open) fillDetail();
  emptyEl.hidden = state.restaurants.length > 0;
  countEl.textContent = state.restaurants.length ? `${state.restaurants.length}곳` : '';
}

// ---------- 맛집 추가 / AI 추천 ----------
const form = $('form');
const nameEl = $('name');
const menuEl = $('menu');
const locationEl = $('location');
const ratingEl = $('rating');
const reviewEl = $('review');

function fail(message, field) {
  msgEl.textContent = message;
  field.focus();
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = nameEl.value.trim();
  const menu = menuEl.value.trim();
  const location = locationEl.value.trim();
  const review = reviewEl.value.trim();
  const rating = Number(ratingEl.value);

  if (!name) return fail('식당 이름을 입력해 주세요.', nameEl);
  if (len(name) > LIMIT.name) return fail(`식당 이름은 ${LIMIT.name}자 이하로 써 주세요.`, nameEl);
  if (len(menu) > LIMIT.menu) return fail(`메뉴는 ${LIMIT.menu}자 이하로 써 주세요.`, menuEl);
  if (len(location) > LIMIT.location) return fail(`위치는 ${LIMIT.location}자 이하로 써 주세요.`, locationEl);
  if (!Number.isInteger(rating) || rating < 1 || rating > 5) return fail('별점을 선택해 주세요.', ratingEl);
  if (len(review) > LIMIT.review) return fail(`한줄평은 ${LIMIT.review}자 이하로 써 주세요.`, reviewEl);

  try {
    await call('add_restaurant', { name, menu, location, rating, review });
    form.reset();
    msgEl.textContent = '';
    nameEl.focus();
    page = 1; // 새 카드는 맨 앞 페이지에 있다
    await refresh();
  } catch (err) {
    msgEl.textContent = err.message;
  }
});

const aiBtn = $('ai');
aiBtn.addEventListener('click', async () => {
  const name = nameEl.value.trim();
  const menu = menuEl.value.trim();
  if (!name) return fail('AI 추천을 받으려면 식당 이름을 먼저 입력해 주세요.', nameEl);
  if (len(name) > LIMIT.name) return fail(`식당 이름은 ${LIMIT.name}자 이하로 써 주세요.`, nameEl);
  if (len(menu) > LIMIT.menu) return fail(`메뉴는 ${LIMIT.menu}자 이하로 써 주세요.`, menuEl);

  msgEl.textContent = '';
  aiBtn.disabled = true;
  aiBtn.textContent = '생각 중…';
  try {
    const res = await call('suggest_review', { name, menu, rating: ratingEl.value ? Number(ratingEl.value) : null });
    if (!res.review) throw new Error('AI 추천을 받지 못했어요. 잠시 뒤 다시 시도해 주세요.');
    reviewEl.value = res.review;
    reviewEl.focus();
  } catch (err) {
    msgEl.textContent = err.message;
  } finally {
    aiBtn.disabled = false;
    aiBtn.textContent = 'AI 추천 리뷰';
  }
});

// ---------- 관리자: 회원 목록 ----------
const adminPanel = $('adminPanel');
const adminMsg = $('adminMsg');
const resetDialog = $('resetDialog');
const resetPw = $('resetPw');
let resetTarget = null;

async function loadMembers() {
  adminMsg.textContent = '';
  adminMsg.classList.remove('ok');
  try {
    const { members } = await call('admin_members');
    $('memberList').replaceChildren(
      ...members.map((m) => {
        const li = el('li', 'cm-item member');
        const left = el('div');
        left.append(el('strong', undefined, m.username));
        if (m.is_admin) left.append(el('span', 'badge', '관리자'));
        left.append(el('div', 'meta', `가입 ${formatWhen(m.created_at)}`));
        const btn = el('button', 'small', '비밀번호 재설정');
        btn.type = 'button';
        btn.addEventListener('click', () => {
          resetTarget = m;
          $('resetDesc').textContent = `"${m.username}" 회원의 새 비밀번호를 정해 주세요. 바꾼 뒤 회원에게 직접 알려 주세요.`;
          resetPw.value = '';
          $('resetMsg').textContent = '';
          resetDialog.showModal();
          resetPw.focus();
        });
        li.append(left, btn);
        return li;
      }),
    );
  } catch (err) {
    adminMsg.textContent = err.message;
  }
}

$('membersBtn').addEventListener('click', async () => {
  adminPanel.hidden = !adminPanel.hidden;
  if (!adminPanel.hidden) await loadMembers();
});

$('resetCancel').addEventListener('click', () => resetDialog.close());
resetDialog.addEventListener('close', () => {
  resetPw.value = '';
  resetTarget = null;
});

$('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!resetTarget) return;
  const password = resetPw.value;
  if (len(password) < 4) return void ($('resetMsg').textContent = '비밀번호는 4자 이상으로 입력해 주세요.');
  const btn = $('resetOk');
  btn.disabled = true;
  try {
    await call('admin_reset_password', { member_id: resetTarget.id, password });
    const name = resetTarget.username;
    resetDialog.close();
    adminMsg.classList.add('ok');
    adminMsg.textContent = `"${name}" 회원의 비밀번호를 바꿨어요.`;
  } catch (err) {
    $('resetMsg').textContent = err.message;
  } finally {
    btn.disabled = false;
  }
});

// ---------- 시작 ----------
(async () => {
  if (!token) return showAuth();
  try {
    me = await call('me');
    showApp();
    await refresh();
  } catch (err) {
    if (!me) showAuth(err.message);
    else msgEl.textContent = err.message;
  }
})();
</script>
